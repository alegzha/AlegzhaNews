# Необов'язкові фільтри (регістр не важливий).
# skip_keywords — новини з цими словами в заголовку не публікуються.
filters:
  skip_keywords:
    - "deals"
    - "discount"
    - "best buy"
    - "giveaway"
    - "sponsored"
    - "quiz"
  # Якщо бот помилково зробив посиланням не гру (звичайне слово, яке збіглося
  # з назвою якоїсь гри в Steam) — допиши це слово сюди.
  steam_ignore:
    - "GTA"          # інакше «GTA 6» стає посиланням на підписку GTA+

# Стеження за вішлістом Steam: пост, коли гра вийшла або отримала знижку.
# Вішліст має бути публічним: Steam → профіль → Редагувати профіль →
# Налаштування приватності → «Інформація про ігри» = Відкрито.
wishlist:
  enabled: true
  profile: "https://steamcommunity.com/id/alegzha/"   # твій профіль Steam
  country: UA                # регіон Steam: Україна, ціни в гривнях (₴)
  min_discount: 10           # не повідомляти про знижки менші за це (у %)
  notify_release: true       # пост, коли гра з вішліста вийшла
  notify_discount: true      # пост, коли з'явилась або збільшилась знижка
  check_every_minutes: 60    # як часто перевіряти вішліст
  sale_digest_min: 4         # стільки знижок одночасно — одна підбірка замість окремих постів

# «Релізи тижня»: раз на тиждень пост з іграми, що виходять у найближчі 7 днів —
# з твого вішліста (з цінами в ₴) і найочікуваніші релізи Steam.
weekly_releases:
  enabled: true
  weekday: mon      # день тижня: mon, tue, wed, thu, fri, sat, sun
  hour: 10          # година за Києвом
  top: 10           # скільки найочікуваніших ігор Steam показувати

# Нові релізи виконавців, на яких ти підписаний у Spotify.
# Потрібні секрети SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET, SPOTIFY_REFRESH_TOKEN.
spotify:
  enabled: true
  emoji: "🎧"
  hashtag: "#нові_релізи"
  include_groups: "album,single"   # album — альбоми, single — сингли й EP
  artists_per_run: 10              # скількох виконавців перевіряти за запуск (по колу; Spotify суворий до частих запитів)
  max_age_days: 14                 # старіші релізи не публікуються

  friday_digest: true              # сингли й EP — однією підбіркою в пʼятницю, альбоми — одразу
  digest_hour: 19                  # о котрій годині (Київ) пʼятнична підбірка

# Халява: безкоштовні ігри назавжди (Epic Games Store, Steam, GOG)
freebies:
  enabled: true
  emoji: "🎁"
  hashtag: "#халява"
  platforms: "epic-games-store.steam.gog"
  check_every_minutes: 120

# Пост, коли гра з вішліста або з топу Steam отримує українську (інтерфейс, субтитри, озвучку)
ukrainian:
  enabled: true
  hashtag: "#українською"
  check_every_minutes: 360
  max_per_run: 5

# Вечірній пост «Головне за день»: Gemini вибирає найважливіші пости дня
daily_digest:
  enabled: true
  hour: 21          # година за Києвом
  count: 7

# Твої улюблені гурти, ігри, серіали тощо: новини про них позначаються ⭐ і дублюються тобі в особисті
favorites: []

# Деякі сайти (напр. Mezha) не пускають сервери GitHub. Тоді бот читає їх
# через твій воркер Cloudflare (сайти дозволено у змінній воркера PROXY_HOSTS).
fetch_proxy: "https://alegzhanews.alegzha.workers.dev/feed"

# Тихі години (за Києвом): пости публікуються, але без звуку
quiet_hours: [23, 8]

# Ліміти, щоб канал не перетворився на смітник
limits:
  max_posts_per_run: 15        # максимум постів за одну перевірку (кожні 30 хв)
  max_per_source_per_run: 5    # максимум з одного сайту за перевірку
  max_age_hours: 12            # старіші новини ігноруються
  summary_chars: 450           # довжина опису під заголовком
  summarize: true              # англомовні статті: Gemini пише короткий переказ самої статті
                               # (для окремого джерела можна вимкнути: summarize: false)
