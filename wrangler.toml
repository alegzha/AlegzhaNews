# Налаштування для автодеплою воркера з GitHub (Cloudflare → Workers Builds).
# Код воркера лежить у worker/worker.js. Змінні й секрети задаються в дашборді
# Cloudflare і тут не зберігаються (keep_vars = true не дає їх затерти).
name = "alegzhanews"
main = "worker/worker.js"
compatibility_date = "2026-09-01"
keep_vars = true

# Запуск бота кожні 30 хвилин (точніше, ніж розклад GitHub)
[triggers]
crons = ["*/30 * * * *"]
