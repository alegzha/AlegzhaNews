name: News to Telegram

on:
  schedule:
    - cron: "*/30 * * * *"   # кожні 30 хвилин
  workflow_dispatch:          # кнопка ручного запуску у вкладці Actions

permissions:
  contents: write             # щоб зберігати state.json (які новини вже опубліковані)

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, translate and post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_WISHLIST_CHAT_ID: ${{ secrets.TELEGRAM_WISHLIST_CHAT_ID }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          if [ -f state.json ] && [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git push
          fi
